<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquazoïdex</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04121f;--panel:#0b2438;--line:#16405e;--tx:#e6f6ff;--mut:#7fa6bf;--ac:#5ee1c8;--co:#ff7a6b;--gold:#ffd166;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:#010a12;color:var(--tx);font-family:'Fredoka',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:410px;height:100%;max-height:840px;background:linear-gradient(#04121f,#062a40 70%,#031019);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:500px){#app{border-radius:36px;border:8px solid #1b2b38;height:94vh}}
header{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;font-weight:600}h2{font-size:18px;margin-bottom:8px}
.tag{font-size:12px;background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--ac)}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:#041a2b}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400}
nav .on{color:var(--ac)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.big{font-size:44px;font-weight:600;color:var(--ac);line-height:1}
.mut{color:var(--mut);font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:600;font-size:15px;background:var(--ac);color:#032;cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center;padding:10px 4px;font-size:12px;cursor:pointer}
.sp i{display:block;font-style:normal;font-size:34px}
.sp.lock{opacity:.35;filter:grayscale(1)}
.rare{border-color:var(--gold)}
.plan{display:flex;gap:12px;align-items:center}
.plan i{font-style:normal;font-size:40px}
.plan.dis{opacity:.5}
.price{margin-left:auto;font-weight:600;color:var(--gold);text-align:right}
.bar{height:8px;border-radius:9px;background:#0a1c2b;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--gold);transition:width .4s}
.tank{position:relative;height:250px;border-radius:18px;background:linear-gradient(#0a4a6b,#052a40);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.pet{position:absolute;left:0;top:0;font-size:38px;cursor:pointer;text-align:center;will-change:transform}
.pet small{display:block;font-size:11px;color:#fff}
@keyframes sw{to{transform:translate(40px,-14px)}}
.sonar{width:100%;height:120px;border-radius:14px;background:#021019;position:relative;overflow:hidden;border:1px solid var(--line)}
.sonar b{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid var(--ac);animation:ping 2.4s infinite}
@keyframes ping{to{transform:scale(8);opacity:0}}
.sonar em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:30px}
.toast{position:absolute;left:12px;right:12px;bottom:78px;z-index:4;display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--ac);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:0 4px 16px #0008;font-size:14px}
.toast img{width:44px;height:44px;border-radius:10px;object-fit:cover}.toast span{font-size:32px}
.modal{position:absolute;inset:0;background:#000a;display:flex;align-items:center;padding:20px;z-index:5}
.modal .card{width:100%;text-align:center}
.modal .em{font-size:70px}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}.ph.big{width:230px;max-width:100%;margin:0 auto;border-radius:16px}
input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#031624;color:var(--tx);font:inherit;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div>

{id:1,e:'🐠',n:'Abyssal clownfish',d:300,f:"It lives in symbiosis with anemones, even in dark waters."},
{id:2,e:'🦑',n:'Vampire squid',d:600,f:"Neither squid nor octopus: a survivor from the age of the dinosaurs."},
{id:3,e:'🐙',n:'Dumbo octopus',d:1500,f:"It flaps its “ears” like Disney's elephant to swim."},
{id:4,e:'🦈',n:'Goblin shark',d:1200,f:"Its jaw shoots forward to snatch prey."},
{id:5,e:'🪼',n:'Crown jellyfish',d:1800,f:"It glows blue to hide from predators."},
{id:6,e:'🐡',n:'Hatchetfish',d:2200,f:"Its belly glows to vanish against the faint light from above."},
{id:7,e:'🦐',n:'Vent shrimp',d:3000,f:"It lives around volcanic vents hotter than 300 °C."},
{id:8,e:'🐟',n:'Deep-sea anglerfish',d:3500,f:"Its lantern lures prey. Males fuse onto the female!"},
{id:9,e:'🧬',n:'Unknown species #1',d:4000,nw:1,f:"Never observed before. No name, no record: it's yours to christen."},

{id:12,e:'🦈',n:"Great hammerhead",d:80,f:"Its wide head works like a metal detector, sensing the faint electric fields of hidden prey."},

{id:16,e:'🌀',n:"Seahorse",d:10,f:"Males carry the eggs in a pouch and give birth to the young."},
{id:17,e:'🐡',n:"Pufferfish",d:25,f:"When threatened, it gulps water and inflates into a spiky ball."},
{id:18,e:'🐳',n:"Humpback whale",d:150,f:"Males sing long, complex songs that can carry for many kilometers."},
{id:19,e:'🐬',n:"Bottlenose dolphin",d:50,f:"It sleeps with half of its brain at a time, so it never stops breathing."},
{id:20,e:'🐢',n:"Hawksbill sea turtle",d:10,f:"Decades later, it returns to the very beach where it was born to lay its eggs."},
{id:21,e:'🦇',n:"Manta ray",d:40,f:"With wings up to 7 m wide, it has one of the largest brains of any fish."},
{id:22,e:'🐟',n:"Whale shark",d:70,f:"The biggest fish in the ocean eats only plankton, and its spots are unique like fingerprints."},
{id:23,e:'🦑',n:"Colossal squid",d:1700,f:"Its eyes, up to 27 cm wide, are the largest of any animal and spot whales in the dark."},
{id:24,e:'🎏',n:"Tripod fish",d:4400,f:"It stands still on three long fins on the seafloor, facing the current to catch drifting prey."}];

function ic(s,b){return IMG[s.id]?`<img class="ph${b?' big':''}" src="${IMG[s.id]}" alt="">`:s.e}
function nm(s){return S.names[s.id]||s.n}
function pet(id){const h=S.joy[id]??0;return h>60?'😄':h>25?'🙂':'😢'}
function render(top){const m=$.querySelector('main');const sc=top||!m?0:m.scrollTop;draw();const n=$.querySelector('main');if(n)n.scrollTop=sc}
function draw(){
 if(!S.plan){$.innerHTML=`<header><h1>🌊 Aquazoïdex</h1></header><main>
 <p class="mut" style="margin-bottom:14px">Follow your deep-sea robot and collect what it discovers. Choose your subscription.</p>
 ${Object.entries(PL).map(([k,p])=>`<div class="card plan"><i>${p.e}</i><div><b>${p.n}</b><div class="mut">${p.desc}</div></div><div class="price">$${p.p}<div class="mut">/month</div><button class="btn" style="padding:6px 12px;font-size:13px" onclick="sub('${k}')">Choose</button></div></div>`).join('')}
 <div class="card plan dis"><i>🐠</i><div><b>Aquazoïd Nemo</b><div class="mut">Down to 800 m</div></div><div class="price" style="color:var(--mut)">Coming soon<div class="mut">price TBD</div></div></div>
 <p class="mut" style="text-align:center">Robots are sold to scientists and launched by our team.</p></main>`;return}
 const p=PL[S.plan];let body='';
 if(S.tab=='bot'){const pct=Math.round(S.depth/p.max*100);
  body=`<div class="card"><div class="mut">Current depth</div><div class="big" id="dep">${Math.round(S.depth)} m</div>
  <div class="bar"><span id="depbar" style="width:${pct}%;background:var(--ac)"></span></div><div class="mut" style="margin-top:6px">Mission: ${p.n} · limit ${p.max} m</div></div>
  <div class="sonar"><b></b><em>${p.e}</em></div>
  <div class="card" style="margin-top:12px"><b>Species found: ${S.found.length}/${SP.length}</b><div class="mut">The robot detects new species as it dives deeper.</div>${S.plan=='star'?'<div class="mut" style="margin-top:4px">🔒 '+SP.filter(s=>s.d>p.max).length+' deeper species need the Aquazoïd Phantom.</div>':''}
  <button class="btn alt" onclick="disc(PL[S.plan].max)" ${SP.some(s=>!S.found.includes(s.id)&&s.d<=p.max)?'':'disabled'}>🎬 Simulate a discovery</button></div>`;}
 if(S.tab=='col'){body=`<h2>My collection</h2><div class="grid">${SP.map(s=>{const o=S.found.includes(s.id);return `<div class="sp ${o?'':'lock'} ${s.nw&&o?'rare':''}" onclick="${o?`info(${s.id})`:''}"><i>${o?ic(s):(s.d>p.max?'🔒':'❔')}</i>${o?nm(s):(s.d>p.max?'Aquazoïd Phantom only':'???')}</div>`}).join('')}</div>`;}
 if(S.tab=='aq'){body=`<h2>My aquarium</h2><div class="tank" id="tank">${S.found.length?S.found.map(id=>`<div class="pet" id="p${id}" onclick="play(${id})">${by(id).e}<small id="pm${id}">${pet(id)}</small></div>`).join(''):'<p class="mut" style="padding:20px">Empty for now. Wait for the robot\'s discoveries.</p>'}</div>
  ${S.found.map(id=>`<div class="card" style="padding:10px"><div style="display:flex;justify-content:space-between"><span>${by(id).e} ${nm(by(id))}</span><span id="pt${id}">${pet(id)}</span></div><div class="mut" style="font-size:11px;margin-top:2px">Happiness</div><div class="bar"><span id="hb${id}" style="width:${S.joy[id]??0}%"></span></div></div>`).join('')}
  <p class="mut">Tap a species to play a mini-game and make it happy.</p>`;}
 if(S.tab=='ab'){body=`<h2>My subscription</h2><div class="card plan"><i>${p.e}</i><div><b>${p.n}</b><div class="mut">${p.desc}</div></div><div class="price">${p.p}$/month</div></div>
  <button class="btn alt" onclick="S.plan=null;S.depth=0;S.found=[];render(1)">Change subscription</button>`;}
 const tabs=[['bot','🤖','Robot'],['col','📖','Collection'],['aq','🫧','Aquarium'],['ab','💳','Account']];
 $.innerHTML=`<header><h1>🌊 Aquazoïdex</h1><span class="tag">${p.n}</span></header><main>${body}</main>
 <nav>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render(1)"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>${S.modal||''}`;
}
function sub(k){S.plan=k;S.depth=0;S.tab='bot';render(1)}
function disc(maxD,auto){const pool=SP.filter(s=>!S.found.includes(s.id)&&s.d<=maxD);if(!pool.length)return;const s=pool[Math.floor(Math.random()*pool.length)];S.found.push(s.id);S.joy[s.id]=0;

 ${s.nw?`<input id="nn" placeholder="Give it a name" maxlength="24"><button class="btn" onclick="nameIt(${s.id})">Name this species</button>`:`<button class="btn" onclick="S.modal=null;render()">Add to my collection</button>`}</div></div>`;render()}
function nameIt(id){const v=document.getElementById('nn').value.trim();if(v)S.names[id]=v;S.modal=null;S.tab='col';render(1)}
function info(id){const s=by(id);S.modal=`<div class="modal" onclick="S.modal=null;render()"><div class="card"><div class="em">${ic(s,1)}</div><h2>${nm(s)}</h2><p class="mut">Spotted around ${s.d} m</p><p style="margin-top:8px">${s.f}</p></div></div>`;render()}

function upd(){const p=PL[S.plan];if(!p)return;
 const d=document.getElementById('dep');if(d)d.textContent=Math.round(S.depth)+' m';
 const b=document.getElementById('depbar');if(b)b.style.width=Math.round(S.depth/p.max*100)+'%';
 S.found.forEach(i=>{const h=S.joy[i]??0,bb=document.getElementById('hb'+i);if(bb)bb.style.width=h+'%';['pm','pt'].forEach(k=>{const e=document.getElementById(k+i);if(e)e.textContent=pet(i)})})}
setInterval(()=>{if(!S.plan||S.modal||S.game)return;const p=PL[S.plan];
 S.depth=Math.min(p.max,S.depth+p.spd);
 S.found.forEach(i=>S.joy[i]=Math.max(0,(S.joy[i]??0)-.4));
 if(SP.some(s=>!S.found.includes(s.id)&&s.d<=S.depth)&&Math.random()<.15){disc(S.depth,1);return}
 upd()},1000);

let G=null;
function ov(h){let o=document.getElementById('ov');if(!o){$.insertAdjacentHTML('beforeend','<div class="modal" id="ov"></div>');o=document.getElementById('ov')}o.innerHTML=h}
function toast(s){const o=document.getElementById('toast');if(o)o.remove();
 $.insertAdjacentHTML('beforeend',`<div id="toast" class="toast" onclick="this.remove();info(${s.id})">${IMG[s.id]?`<img src="${IMG[s.id]}" alt="">`:`<span>${s.e}</span>`}<div><b>New discovery!</b><div class="mut">${nm(s)} · ${s.d} m</div></div></div>`);
 setTimeout(()=>{const x=document.getElementById('toast');if(x)x.remove()},4000)}
function endG(){if(G){cancelAnimationFrame(G.raf);if(G.key)removeEventListener('keydown',G.key)}const o=document.getElementById('ov');if(o)o.remove();G=null;S.game=0}
function play(id){if(G)return;G={id};S.game=1;ov(`<div class="card"><div class="em">${by(id).e}</div><h2>Play with ${nm(by(id))}</h2><p class="mut">Pick a game to make it happy.</p><button class="btn" onclick="g1()">🪢 Jump rope</button><button class="btn" onclick="g2()">🚧 Dodge the rocks</button><button class="btn" onclick="g3()">➕ Quick maths</button><button class="btn" onclick="g4()">🧠 Species quiz</button><button class="btn alt" onclick="endG()">Cancel</button></div>`)}
function fin(f,txt){cancelAnimationFrame(G.raf);if(G.key)removeEventListener('keydown',G.key);const id=G.id,pts=Math.round(f*40);S.joy[id]=Math.min(100,(S.joy[id]??0)+pts);
 ov(`<div class="card"><div class="em">${f>.6?'🎉':f>.3?'🙂':'😢'}</div><h2>${txt}</h2><p style="margin-top:6px">+${pts} happiness 💛</p><button class="btn" onclick="endG()">Back to aquarium</button></div>`);upd()}
function g1(){const W=300,H=220,gr=180,T=.55,tot=8;
 ov(`<div class="card"><h2>🪢 Jump rope</h2><p class="mut">Tap JUMP just before the rope hits the floor!</p><canvas id="cv" width="300" height="220" style="width:100%;border-radius:12px;background:#052a40;margin-top:8px"></canvas><button class="btn" id="jb">JUMP</button></div>`);
 const cv=document.getElementById('cv'),c=cv.getContext('2d'),e=by(G.id).e;let a=-4,hits=0,n=0,jt=-1,msg='',mt=0,last=performance.now();
 const jump=()=>{if(jt<0)jt=0};document.getElementById('jb').onclick=jump;cv.onclick=jump;
 (function lp(now){const dt=Math.min(.05,(now-last)/1000);last=now;const pa=a;a+=5.5*dt;
  if(jt>=0){jt+=dt;if(jt>T)jt=-1}
  const h=jt>=0?180*(jt/T)*(1-jt/T):0;
  if(Math.floor(a/6.2832)>Math.floor(pa/6.2832)){n++;if(h>14){hits++;msg='✔'}else msg='✖';mt=.5}
  mt-=dt;c.clearRect(0,0,W,H);c.textAlign='center';c.font='46px serif';c.fillText(e,W/2,gr-h);
  c.strokeStyle='#ffd166';c.lineWidth=4;c.beginPath();c.moveTo(W/2-60,gr-30);c.quadraticCurveTo(W/2,gr-30+Math.cos(a)*110,W/2+60,gr-30);c.stroke();
  c.fillStyle='#e6f6ff';c.font='18px sans-serif';c.fillText(hits+' / '+n+'  '+(mt>0?msg:''),W/2,24);
  if(n>=tot){fin(hits/tot,hits+' / '+tot+' jumps');return}
  G.raf=requestAnimationFrame(lp)})(last)}
function g2(){const W=300,H=260,L=W/3;
 ov(`<div class="card"><h2>🚧 Dodge the rocks</h2><p class="mut">Tap left, middle or right (or use the arrow keys).</p><canvas id="cv" width="300" height="260" style="width:100%;border-radius:12px;background:#052a40;margin-top:8px"></canvas></div>`);
 const cv=document.getElementById('cv'),c=cv.getContext('2d'),e=by(G.id).e;let lane=1,ob=[],sp=0,tot=0,hit=0,t=0,last=performance.now();
 cv.onclick=ev=>{const r=cv.getBoundingClientRect();lane=Math.min(2,Math.max(0,Math.floor((ev.clientX-r.left)/r.width*3)))};
 G.key=ev=>{if(ev.key=='ArrowLeft')lane=Math.max(0,lane-1);if(ev.key=='ArrowRight')lane=Math.min(2,lane+1)};addEventListener('keydown',G.key);
 (function lp(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;sp+=dt;
  if(sp>.75&&t<14){sp=0;ob.push({l:Math.floor(Math.random()*3),y:-30,h:0});tot++}
  ob.forEach(o=>{o.y+=170*dt;if(!o.h&&o.l==lane&&o.y>H-75&&o.y<H-20){o.h=1;hit++}});ob=ob.filter(o=>o.y<H+30);
  c.clearRect(0,0,W,H);c.strokeStyle='#16405e';c.lineWidth=1;[1,2].forEach(i=>{c.beginPath();c.moveTo(i*L,0);c.lineTo(i*L,H);c.stroke()});
  c.textAlign='center';c.font='34px serif';ob.forEach(o=>c.fillText(o.h?'💥':'🪨',o.l*L+L/2,o.y));
  c.font='44px serif';c.fillText(e,lane*L+L/2,H-14);c.fillStyle='#e6f6ff';c.font='16px sans-serif';c.fillText('Hits: '+hit,40,22);
  if(t>=14&&!ob.length){fin((tot-hit)/tot,'Dodged '+(tot-hit)+' / '+tot);return}
  G.raf=requestAnimationFrame(lp)})(last)}
function g3(){let q=0,ok=0;const N=5,R=n=>Math.floor(Math.random()*n);
 const ask=()=>{const o=['+','−','×'][R(3)];let a,b,r;
  if(o=='×'){a=2+R(8);b=2+R(8);r=a*b}else{a=10+R(40);b=o=='+'?5+R(40):5+R(a-5);r=o=='+'?a+b:a-b}
  const s=new Set([r]);while(s.size<3){const d=r+R(11)-5;if(d>=0)s.add(d)}
  const ch=[...s].sort(()=>Math.random()-.5);
  ov(`<div class="card"><div class="em">${by(G.id).e}</div><p class="mut">Question ${q+1} / ${N}</p><h2 style="font-size:30px;margin:8px 0">${a} ${o} ${b} = ?</h2>${ch.map(v=>`<button class="btn alt" onclick="ans(${v==r})">${v}</button>`).join('')}</div>`)};
 window.ans=g=>{if(g)ok++;q++;q<N?ask():fin(ok/N,ok+' / '+N+' correct')};ask()}

function g4(){let q=0,ok=0;const N=5,P=SP.filter(s=>!s.nw),order=[...P].sort(()=>Math.random()-.5);
 const ask=()=>{const s=order[q],img=Math.random()<.5||s.f.toLowerCase().includes(s.n.toLowerCase());
  const ch=[s,...P.filter(x=>x.id!=s.id).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
  ov(`<div class="card"><p class="mut">Question ${q+1} / ${N}</p>${img?`<div class="em" style="margin:8px 0">${ic(s,1)}</div><h2>Which species is this?</h2>`:`<h2>Which species matches this clue?</h2><p style="margin:10px 0;font-style:italic">${s.f}</p>`}${ch.map(c=>`<button class="btn alt" ${c.id==s.id?'data-ok="1"':''} onclick="qa(this)">${nm(c)}</button>`).join('')}</div>`)};
 window.qa=b=>{if(G.lock)return;G.lock=1;const g=b.dataset.ok;if(g)ok++;
  document.querySelectorAll('#ov .btn').forEach(x=>{if(x.dataset.ok){x.style.background='#2fbf71';x.style.color='#fff'}});
  if(!g){b.style.background='#e05555';b.style.color='#fff'}
  setTimeout(()=>{if(!G)return;G.lock=0;q++;q<N?ask():fin(ok/N,ok+' / '+N+' correct')},900)};ask()}
const PT={};let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const tk=document.getElementById('tank');
 if(tk&&S.tab=='aq'){const W=Math.max(0,tk.clientWidth-50),H=Math.max(0,tk.clientHeight-60);
  S.found.forEach(id=>{const el=document.getElementById('p'+id);if(!el)return;
   const q=PT[id]||(PT[id]={x:Math.random()*W,y:Math.random()*H,tx:Math.random()*W,ty:Math.random()*H,w:3});
   q.w-=dt;const dx=q.tx-q.x,dy=q.ty-q.y,d=Math.hypot(dx,dy);
   if(q.w<=0||d<4){q.tx=Math.random()*W;q.ty=Math.random()*H;q.w=2+Math.random()*4}
   else{const sp=20+30*(S.joy[id]??0)/100;q.x+=dx/d*sp*dt;q.y+=dy/d*sp*dt}
   el.style.transform=`translate(${q.x}px,${q.y+Math.sin(t/450+id)*4}px)`})}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
render();
</script></body></html>
